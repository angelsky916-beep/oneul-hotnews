name: Build today's Short

on:
  push:
    paths:
      - "content/latest.json"
      - "scripts/build_video.py"
      - ".github/workflows/build-video.yml"
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: oneul-hotnews-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install FFmpeg and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk python3-pip
          python3 -m pip install --disable-pip-version-check edge-tts

      - name: Build MP4
        run: python3 scripts/build_video.py

      - name: Publish latest MP4 to public media branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin media || true
          git checkout --orphan media
          git rm -rf . || true
          cp build/latest.mp4 latest.mp4
          git add latest.mp4
          git commit -m "Update latest Short"
          git push --force origin media

      - name: Upload build artifact for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: latest-short
          path: build/latest.mp4
          retention-days: 1
